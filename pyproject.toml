[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4ao"
version = "0.1.0"

description = "Adaptive Optics simulation framework in PyTorch"

readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "torch>=2.6",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "mmengine"
]