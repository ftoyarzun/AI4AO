[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "AI4AO"
version = "0.1.0"

description = "Adaptive Optics simulation framework in PyTorch"

readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "ipython",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "mmengine"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises Trainer.train/evaluate or TwinCalibrator fit loops end-to-end; opt out with -m 'not slow'",
]