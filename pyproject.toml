[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "AI4AO"
version = "0.1.0"

description = "Adaptive Optics simulation framework in PyTorch"

readme = "README.md"

requires-python = ">=3.10"

# torch is intentionally NOT here: install it separately so you pick the build
# that matches your CUDA/CPU setup (see README), or `pip install -e ".[torch]"`
# for a plain default wheel.
dependencies = [
    "ipython",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "mmengine"
]

[project.optional-dependencies]
# Plain default torch wheel, for when you don't need a specific CUDA build.
torch = ["torch>=2.1"]
# TensorRT deployment path (AI4AO/DAO_Utils.py); needs a matching CUDA/TensorRT
# toolchain on the machine.
trt = ["pycuda", "tensorrt"]
test = ["AI4AO[torch]", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises Trainer.train/evaluate or TwinCalibrator fit loops end-to-end; opt out with -m 'not slow'",
]