<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Comparisons Report</title>
<style>
:root {
  --bg: #f7f6f3; --surface: #fcfcfb; --border: #e2e0da;
  --text: #0b0b0b; --text-2: #52514e; --muted: #807e78;
  --bar: #86b6ef; --bar-best: #1c5cab; --whisker: #52514e; --grid: #ecebe7;
  --warn-bg: #fff4dc; --warn-border: #eda100; --bad-bg: #fde8e8; --bad-border: #d03b3b;
  --tie: #1c5cab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1a1a19; --border: #383835;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
    --bar: #3d5f8a; --bar-best: #6da7ec; --whisker: #c3c2b7; --grid: #2a2a28;
    --warn-bg: #3a2f14; --warn-border: #c98500; --bad-bg: #3d1c1c; --bad-border: #e66767;
    --tie: #86b6ef;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1a1a19; --border: #383835;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
  --bar: #3d5f8a; --bar-best: #6da7ec; --whisker: #c3c2b7; --grid: #2a2a28;
  --warn-bg: #3a2f14; --warn-border: #c98500; --bad-bg: #3d1c1c; --bad-border: #e66767;
  --tie: #86b6ef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0; }
.sub { color: var(--text-2); margin: 0 0 24px; font-size: 14px; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
.box h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); margin: 0 0 8px; }
.box ul { margin: 0; padding-left: 20px; }
.box li { margin: 3px 0; }
.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.bad { background: var(--bad-bg); border-color: var(--bad-border); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-2); font-weight: 600; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }
.best-table td:first-child { color: var(--text-2); white-space: nowrap; }
section.nb { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin: 20px 0; }
.nbfile { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
.varied { color: var(--text-2); margin: 6px 0 10px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-2); font-size: 12px; }
svg .val { fill: var(--text); font-variant-numeric: tabular-nums; }
.takeaway { margin: 12px 0 0; font-size: 14px; }
.takeaway b { color: var(--text); }
.note { margin: 8px 0 0; font-size: 13px; color: var(--text-2); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-2); margin-left: 4px; }
.tag.best { border-color: var(--bar-best); color: var(--bar-best); font-weight: 600; }
.tag.miss { border-color: var(--bad-border); color: var(--bad-border); font-weight: 600; }
tr.missing td { background: var(--bad-bg); }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; z-index: 10; }
.hit { fill: transparent; cursor: default; }
.hit:hover { fill: var(--grid); fill-opacity: .6; }
code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <h1>Advanced comparisons: results</h1>
  <p class="sub" id="sub"></p>

  <div class="box" id="missing-box"></div>
  <div class="box">

  </div>
  <div class="box warn">
    <h3>Known discrepancies (noted, not corrected)</h3>
    <ul id="discrepancies"></ul>
  </div>
  <div class="box">
    <h3>How to read</h3>
    <ul id="method"></ul>
  </div>

  <div id="sections"></div>

  <section class="nb" id="final"></section>
</main>

const NOTES = {"order": ["CNNArchitectureComparison", "ActivationComparison", "AdvancedArchitectureComparison", "NormalizationComparison", "PoolingComparison", "LossFunctionComparison", "CNNSizeComparison", "WidthDepthComparison"], "subtitle": "8 ablation notebooks in <code>Tutorials/Advanced</code> \u00b7 46 checkpoints re-evaluated \u00b7 metric: steady-state closed-loop residual, nm RMS (lower is better) \u00b7 2026-09-29", "combined": "<b>Combined config (tested, see the final remark at the bottom):</b> StemEncoder, ELU, MaxPool, no normalization, ModalMAE loss, widened to ~2.8M params. It reaches <b>106.3 nm</b>, better than every single-axis winner.", "method": ["Notebooks have no saved outputs and the <code>.pth</code> files hold weights only, so every number was recomputed: each notebook's own setup cells were executed, stage-2 checkpoints loaded (strict), and its <code>Trainer.evaluate()</code> rollout run (200 steps, first 30% discarded, RMS over the pupil and the 16-phase batch).", "5 seeds (1234\u20131238), shared by all arms of a notebook. <b>nm RMS</b> = mean \u00b1 sd over seeds; <b>nb. seed</b> = seed 1234 alone; <b>n.s.</b> / \u2248 = paired difference to the best arm is within 2 standard errors. With 5 seeds this often just means \u201ctoo noisy to call\u201d, not \u201cas good\u201d.", "All 8 notebooks share <code>CNNComparison_params.py</code> (17 actuators / 190 modes, noise on), so the instrument is identical across them, but training budgets differ (see discrepancies). Compare arms within a notebook, not across notebooks.", "Seed 1237 is a hard draw: several arms (Classic, ResNet, GroupNorm, 1M_deep_res\u2026) jump to 200\u2013300 nm there. Most of the large sd values come from that single seed (hover a bar for per-seed values)."], "discrepancies": ["<b>Training budget</b> (not actually a discrepancy): <code>TrainRunNb = 10000</code> counts simulated closed-loop frames. <code>Trainer.train</code> takes <code>TrainRunNb // closed_loop_iteration const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = x => x.toFixed(1);

document.getElementById('sub').innerHTML = NOTES.subtitle;

const allMissing = DATA.flatMap(s => s.arms.filter(a => a.missing).map(a => `${s.title}: <b>${esc(a.name)}</b>`));
const mb = document.getElementById('missing-box');

  const n = DATA.reduce((k, s) => k + s.arms.length, 0);
  mb.innerHTML = `<h3>Checkpoints</h3>All <b>${n}</b> arms across ${DATA.length} notebooks have a saved <code>.pth</code> that loads (strict) into the architecture the notebook currently builds. None missing.`;

document.getElementById('best-table').innerHTML =

  DATA.map(s => {
    const b = s.arms.find(a => a.best);
    const ties = s.arms.filter(a => a.tie).map(a => esc(a.name)).join(', ') || '—';
    return `<tr><td>${esc(s.axis)}</td><td><b>${esc(b.name)}</b></td><td class="num">${fmt(b.mean)} ± ${fmt(b.sd)}</td><td>${ties}</td></tr>`;
  }).join('');

const tip = document.getElementById('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block';
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY + 12) + 'px'; }
function hideTip() { tip.style.display = 'none'; }

function chart(s) {
  const arms = [...s.arms].sort((a, b) => a.mean - b.mean);
  const W = 520, labelW = 118, valW = 92, rowH = 26, top = 6, bot = 22;
  const H = top + arms.length * rowH + bot;
  const xmax = Math.max(...arms.map(a => a.mean + a.sd));
  const niceMax = (() => { const p = Math.pow(10, Math.floor(Math.log10(xmax))); return Math.ceil(xmax / p * 2) / 2 * p; })();
  const plotW = W - labelW - valW;
  const X = v => labelW + v / niceMax * plotW;
  let g = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = niceMax * i / ticks, x = X(v);
    g += `<line x1="${x}" x2="${x}" y1="${top}" y2="${H - bot}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${x}" y="${H - 6}" text-anchor="middle" style="font-size:11px">${Math.round(v)}</text>`;
  }
  arms.forEach((a, i) => {
    const y = top + i * rowH, cy = y + rowH / 2, bh = 14;
    const x0 = X(0), x1 = X(a.mean);
    const col = a.best ? 'var(--bar-best)' : 'var(--bar)';
    const w = Math.max(x1 - x0, 1), r = Math.min(4, w);
    g += `<path d="M${x0},${cy - bh/2} H${x1 - r} Q${x1},${cy - bh/2} ${x1},${cy - bh/2 + r} V${cy + bh/2 - r} Q${x1},${cy + bh/2} ${x1 - r},${cy + bh/2} H${x0} Z" fill="${col}"/>`;
    const xl = X(Math.max(a.mean - a.sd, 0)), xr = X(a.mean + a.sd);
    g += `<line x1="${xl}" x2="${xr}" y1="${cy}" y2="${cy}" stroke="var(--whisker)" stroke-width="1.5"/>`;
    g += `<line x1="${xr}" x2="${xr}" y1="${cy - 4}" y2="${cy + 4}" stroke="var(--whisker)" stroke-width="1.5"/>`;
    g += `<text x="${labelW - 8}" y="${cy + 4}" text-anchor="end"${a.best ? ' style="fill:var(--text);font-weight:600"' : ''}>${esc(a.name)}</text>`;
    g += `<text class="val" x="${W - valW + 8}" y="${cy + 4}">${fmt(a.mean)}${a.tie ? ' ≈' : ''}${a.best ? ' ★' : ''}</text>`;
    const tipHtml = `<b>${esc(a.name)}</b><br>${fmt(a.mean)} ± ${fmt(a.sd)} nm RMS<br><span style="color:var(--text-2)">per seed: ${a.vals.map(fmt).join(', ')}</span>`;
    g += `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-tip="${esc(tipHtml)}"/>`;
  });
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${top}" y2="${H - bot}" stroke="var(--muted)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.title)}: steady-state residual per arm, nm RMS">${g}</svg>
          <div style="font-size:11px;color:var(--muted);text-align:center">steady-state residual, nm RMS (mean of 5 seeds, whisker = +1 sd) · ★ best · ≈ not significantly different from best</div>`;
}

function table(s) {
  const arms = [...s.arms].sort((a, b) => a.mean - b.mean);
  return `<table><tr><th>Arm</th><th class="num">nm RMS</th><th class="num">nb. seed</th></tr>` +
    arms.map(a => `<tr class="${a.missing ? 'missing' : ''}"><td>${esc(a.name)}${a.best ? '<span class="tag best">best</span>' : ''}${a.tie ? '<span class="tag">n.s.</span>' : ''}${a.missing ? '<span class="tag miss">NO .pth</span>' : ''}</td>
      <td class="num">${fmt(a.mean)} ± ${fmt(a.sd)}</td><td class="num">${fmt(a.vals[0])}</td></tr>`).join('') + '</table>';
}

document.getElementById('sections').innerHTML = DATA.map(s => `
  <section class="nb">
    <h2>${esc(s.title)}</h2>
    <div class="nbfile">Tutorials/Advanced/${esc(s.nb)}.ipynb · Data/${esc(s.nb)}/</div>
    <p class="varied">${s.varied}</p>
    <div class="grid2"><div>${chart(s)}</div><div>${table(s)}</div></div>
    <p class="takeaway"><b>Takeaway:</b> ${s.takeaway}</p>
    ${s.note ? `<p class="note">Note: ${s.note}</p>` : ''}

const F = NOTES.final;
document.getElementById('final').innerHTML = `

  <div class="nbfile">Tutorials/Advanced/BestCNN.ipynb · Data/BestCNN/</div>

  ${F.rows.map((r, i) => `<tr><td>${i === 0 ? '<b>' + esc(r[0]) + '</b><span class="tag best">best</span>' : esc(r[0])}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td></tr>`).join('')}
  </table>
  <p class="takeaway"><b>Takeaway:</b> ${F.takeaway}</p>`;

document.querySelectorAll('.hit').forEach(el => {
  el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
  el.addEventListener('mouseleave', hideTip);
});
