# Read the Docs build configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

# torch is not installed here: docs/conf.py mocks it (autodoc_mock_imports), so autodoc
# can import AI4AO and read its docstrings without PyTorch.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
