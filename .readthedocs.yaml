# Read the Docs build configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    # autodoc imports AI4AO, which needs torch. torch is not a hard dependency of the
    # package, so install the small CPU-only wheel before the package itself.
    pre_install:
      - python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
